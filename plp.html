<sc-if value="{{banner.split}}">
<section class="plp-split">
<div class="plp-split__copy"><h1>{{banner.h}}</h1><p>{{banner.p}}</p></div>
<div class="plp-split__media"><img class="hp-img" src="{{banner.i}}" alt="{{banner.alt}}" style="object-position: {{banner.pos}};"></div>
</section>
</sc-if>
<sc-if value="{{banner.hero}}">
<section class="plp-banner">
<img class="hp-img" src="{{banner.i}}" alt="" style="object-position: {{banner.pos}};">
<div class="plp-banner__copy"><h1>{{banner.h}}</h1><p>{{banner.p}}</p></div>
<sc-if value="{{banner.btns}}"><div class="plp-banner__btns"><a class="btn-red" href="plp.html?collection=mens">Shop men’s</a><a class="btn-red" href="plp.html?collection=womens">Shop women’s</a></div></sc-if>
</section>
</sc-if>

<sc-if value="{{banner.search}}">
<section class="plp-search">
<h1>Search results</h1>
<form class="plp-search__form" action="plp.html" role="search"><img src="assets/search-icon.svg" width="22" height="22" alt=""><input type="search" name="q" value="{{q}}" onchange="{{setQ}}" aria-label="Search" autocomplete="off"><button type="button" aria-label="Clear search" onclick="{{clearQ}}"><img src="assets/search-clear.svg" width="22" height="22" alt=""></button></form>
</section>
</sc-if>

<div class="plp-bar">
<div class="plp-facets">
<sc-for list="{{facets}}" as="f">
<div class="plp-facet">
<button type="button" class="plp-dd" aria-expanded="{{f.expanded}}" onclick="{{f.toggle}}">{{f.label}}<sc-if value="{{f.valText}}"><span class="plp-dd__val">{{f.valText}}</span></sc-if><sc-for list="{{f.swatches}}" as="w"><span class="plp-dd__val"><i class="plp-sw" style="background: {{w}};"></i></span></sc-for><img src="assets/plp-chevron-down.svg" width="13.59" height="19.99" alt=""></button>
<sc-if value="{{f.isOpen}}">
<div class="plp-pop">
<sc-if value="{{f.isCheck}}"><sc-for list="{{f.opts}}" as="o"><button type="button" class="plp-check" aria-pressed="{{o.on}}" onclick="{{o.pick}}">{{o.label}}</button></sc-for></sc-if>
<sc-if value="{{f.isSize}}"><div class="plp-sizes"><sc-for list="{{f.opts}}" as="o"><button type="button" class="plp-size" aria-pressed="{{o.on}}" onclick="{{o.pick}}">{{o.label}}</button></sc-for></div></sc-if>
<sc-if value="{{f.isColor}}"><div class="plp-colors"><sc-for list="{{f.opts}}" as="o"><button type="button" class="plp-color" aria-label="{{o.label}}" aria-pressed="{{o.on}}" onclick="{{o.pick}}"><span style="background: {{o.hex}};"></span></button></sc-for></div></sc-if>
<button type="button" class="plp-pop__clear" onclick="{{f.clear}}">Clear</button>
</div>
</sc-if>
</div>
</sc-for>
<sc-if value="{{anyOn}}"><button type="button" class="plp-clear" onclick="{{clearAll}}">Clear all</button></sc-if>
</div>
<span class="plp-count">{{countLabel}}</span>
<div class="plp-facet">
<button type="button" class="plp-dd" aria-expanded="{{sortExpanded}}" onclick="{{toggleSort}}">Sort<img src="assets/plp-chevron-down.svg" width="13.59" height="19.99" alt=""></button>
<sc-if value="{{sortOpen}}"><div class="plp-pop plp-pop--sort"><sc-for list="{{sorts}}" as="o"><button type="button" class="plp-sort" aria-pressed="{{o.on}}" onclick="{{o.pick}}">{{o.label}}</button></sc-for></div></sc-if>
</div>
</div>

<div class="plp-mbar"><button type="button" onclick="{{openSheet}}"><img src="assets/plp-filter-icon.svg" width="20" height="20" alt="">Filter</button><span class="plp-mbar__n">{{countLabel}}</span></div>

<sc-for list="{{sections}}" as="sec">
<sc-if value="{{sec.h}}"><h2 class="plp-h">{{sec.h}}</h2></sc-if>
<div class="plp-grid">
<sc-for list="{{sec.items}}" as="p">
<sc-if value="{{p.isTile}}">
<div class="plp-tile"><img class="hp-img" src="{{tile.i}}" alt="{{tile.alt}}" style="object-position: {{tile.pos}};"><h2>Boots need backup.</h2><a class="btn-red" href="#">{{tile.btn}}</a></div>
</sc-if>
<sc-if value="{{p.t}}">
<div class="plp-card">
<span class="hp-card__media">
<span class="hp-badges"><sc-for list="{{p.b}}" as="b"><span class="{{b.c}}">{{b.l}}</span></sc-for></span>
<img class="hp-img" src="{{p.i}}" alt="{{p.t}}">

const glove = (t, file, color) => item('Motorcycle Gloves', t, 'Motorcycle Gloves', 85, file, color);

const rows = (list, n, extra) => Array.from({ length: n }, () => list).flat().concat(extra || []);
const GLOVES = rows([glove('Full Gauntlet • Brown', 'b1a3da0592ec4c5f137dd36fab09fbf3.jpg', 'Brown'), glove('The Golden Glove', 'e8c53f3c844397af48646f9a61938b55.jpg', 'Tan'), glove('The Getaway Glove', 'bebe2b5742b930cf9ba85bf80c9222cc.webp', 'Black'), glove('Denim On Brown', '8ab98c6b6812dc23c370d31ef130d712.jpg', 'Navy')], 3);
const TEES = [tee('Sons Of Speed', '812d36e7b003d02960cfb189ce318a34.webp', 'Black', [B.ltd]), tee('Gold Skull On Navy', '214926dd2a845505f301eacac923d151.webp', 'Navy'), tee('Black Skull On Gray', '05514e30b150f661c5f7ff1b1f38a2fd.webp', 'Gray'), tee('Navy Skull On White', 'c815d670c7410abb75a07824a8b87f47.webp', 'White')];

const ACCESSORIES = rows(ACCS, 2, ACCS.slice(0, 3));

const matches = (p) => Q.toLowerCase().split(/\s+/).every((w) => (p.t + ' ' + p.s + ' ' + p.cat + ' ' + p.color).toLowerCase().includes(w));
const SECTIONS = IS_COLLECTION ? [{ h: '', items: Q ? BOOTS.concat(GLOVES.slice(0, 4), TEES, ACCS).filter(matches) : BOOTS }] : [
  { h: 'BOOTS', items: BOOTS },
  { h: 'GLOVES', items: GLOVES, pager: true },
  { h: 'APPAREL', items: APPAREL },
  { h: 'ACCESSORIES', items: ACCESSORIES }

const FACETS = [
  { key: 'cat', label: 'Category', kind: 'check', opts: ['Motorcycle Boots', 'Motorcycle Gloves', 'Apparel', 'Accessories'], match: (p, v) => v.includes(p.cat) },
  // Sizes are boot sizes; every boot is in stock in every size in this prototype
  { key: 'size', label: 'Size', kind: 'size', opts: SIZES, match: (p) => p.cat === 'Motorcycle Boots' },
  { key: 'season', label: 'Season', kind: 'check', opts: ['Waterproof', 'Summer'], match: (p, v) => v.includes(p.season) },
  { key: 'color', label: 'Color', kind: 'color', opts: Object.keys(COLORS), match: (p, v) => v.includes(p.color) }
].filter((f) => !(IS_COLLECTION && !Q && f.key === 'cat'));
const SORTS = [['featured', 'Featured'], ['high', 'Price, high to low'], ['low', 'Price, low to high'], ['new', 'New']];
const SORT_FN = { high: (a, b) => b.price - a.price, low: (a, b) => a.price - b.price, new: (a, b) => b.isNew - a.isNew };

const EMPTY = { cat: [], size: [], season: [], color: [] };

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: EMPTY, sort: 'featured', pop: '', acc: {} }; }
  componentDidUpdate(prev, prevState) {
    const s = this.state;
    if (s.drawer !== prevState.drawer || s.sheet !== prevState.sheet) document.documentElement.style.overflow = s.drawer || s.sheet ? 'hidden' : '';
    if (s.drawer === prevState.drawer) return;
    const el = document.querySelector(s.drawer ? (s.drawer === 'all' ? '.mm__sq--back' : '.md__close') : '.nh-menu');
    if (el) el.focus();
  }
  componentDidMount() {
    this._onKey = (e) => { if (e.key === 'Escape') this.setState({ mega: false, drawer: '', pop: '', sheet: false }); };
    this._onDown = (e) => { if (this.state.pop && !e.target.closest('.plp-facet')) this.setState({ pop: '' }); };
    document.addEventListener('keydown', this._onKey);
    document.addEventListener('mousedown', this._onDown);
    this._lastY = 0;
    this._onScroll = (e) => {
      if (e.target !== document) return;
      const y = window.scrollY, d = y - this._lastY;
      if (Math.abs(d) < 6) return;
      const hide = y > 120 && d > 0;
      this._lastY = y;
      if (hide !== !!this.state.navHidden) this.setState({ navHidden: hide });
    };
    document.addEventListener('scroll', this._onScroll, { passive: true });
  }
  componentWillUnmount() { document.removeEventListener('scroll', this._onScroll); document.removeEventListener('keydown', this._onKey); document.removeEventListener('mousedown', this._onDown); }
  toggleValue(key, v) {
    const cur = this.state.sel[key];
    this.setState({ sel: Object.assign({}, this.state.sel, { [key]: cur.includes(v) ? cur.filter((x) => x !== v) : cur.concat(v) }) });
  }
  renderVals() {
    const s = this.state, sel = s.sel;
    const active = FACETS.filter((f) => sel[f.key].length);
    const keep = (p) => active.every((f) => f.match(p, sel[f.key]));
    const sorted = (list) => (SORT_FN[s.sort] ? list.slice().sort(SORT_FN[s.sort]) : list);
    const anyOn = active.length > 0;
    const sections = SECTIONS.map((sec) => {
      const items = sorted(sec.items.filter(keep));
      // The Seven-Year Shirt tile takes the ninth slot on the collection page, as in the Figma frame
      if (IS_COLLECTION && items.length) items.splice(Math.min(8, items.length), 0, { isTile: true });
      return Object.assign({}, sec, { items, count: items.filter((p) => p.t).length });
    });
    const count = sections.reduce((n, sec) => n + sec.count, 0);
    const shown = !count ? [{ h: '', items: [], empty: true }] : IS_COLLECTION ? sections : sections.filter((sec) => sec.count);
    const facets = FACETS.map((f) => {
      const vals = sel[f.key], isOpen = s.pop === f.key, accOpen = !!s.acc[f.key];
      return {
        label: f.label, upper: f.label.toUpperCase(),
        isCheck: f.kind === 'check', isSize: f.kind === 'size', isColor: f.kind === 'color',
        valText: f.kind === 'color' ? '' : vals.join(', '),
        swatches: f.kind === 'color' ? vals.map((v) => COLORS[v]) : [],
        isOpen, expanded: String(isOpen),
        toggle: () => this.setState({ pop: isOpen ? '' : f.key }),
        accOpen: String(accOpen), accOpenBool: accOpen,
        toggleAcc: () => this.setState({ acc: Object.assign({}, s.acc, { [f.key]: !accOpen }) }),
        clear: () => this.setState({ sel: Object.assign({}, sel, { [f.key]: [] }) }),
        opts: f.opts.map((v) => ({ label: v, hex: COLORS[v], on: String(vals.includes(v)), pick: () => this.toggleValue(f.key, v) }))
      };
    });
    const chips = [];
    FACETS.forEach((f) => sel[f.key].forEach((v) => chips.push({ label: v, hex: f.kind === 'color' ? COLORS[v] : '', pick: () => this.toggleValue(f.key, v) })));
    return {
      rootCls: 'p3 hp r2 hp2 plp ' + (IS_COLLECTION ? 'plp--3' : 'plp--4'),
      isCollection: IS_COLLECTION,
      showCrumbs: !Q, showExtras: IS_COLLECTION && !Q,
      q: s.q ?? Q,
      setQ: (e) => this.setState({ q: e.target.value }),
      clearQ: () => { this.setState({ q: '' }); document.querySelector('.plp-search input').focus(); },
      emptyText: Q && !anyOn ? 'No results found for "' + Q + '". Try another search.' : 'No products match these filters.',
      crumb: IS_COLLECTION ? COLLECTION.crumb : 'Shop All',
      tile: IS_COLLECTION ? COLLECTION.tile : {},
      banner: IS_COLLECTION ? COLLECTION.banner : { hero: true, h: 'Shop all', p: 'Lorem ipsum dolor sit amet, consectetur adipiscing.', i: 'assets/dd3019da15a2fd2cfa6cfc6062b47bbe.webp', pos: '50% 68.6%' },
      kitNext: () => { const el = document.getElementById('kit-row'); if (el) el.scrollBy({ left: el.firstElementChild.offsetWidth + 16, behavior: 'smooth' }); },
      sections: shown,
      countLabel: count + (count === 1 ? ' item' : ' items'),
      facets, chips, anyOn,
      clearAll: () => this.setState({ sel: EMPTY }),
      sortOpen: s.pop === 'sort', sortExpanded: String(s.pop === 'sort'),
      toggleSort: () => this.setState({ pop: s.pop === 'sort' ? '' : 'sort' }),
      sort: s.sort,
      sorts: SORTS.map(([key, label]) => ({ key, label, on: String(s.sort === key), pick: () => this.setState({ sort: key, pop: '' }) })),
      sortLabel: SORTS.find(([key]) => key === s.sort)[1],
      sortAccOpen: String(!!s.acc.sort), sortAccOpenBool: !!s.acc.sort,
      toggleSortAcc: () => this.setState({ acc: Object.assign({}, s.acc, { sort: !s.acc.sort }) }),
      sheetOpen: !!s.sheet,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      cartCount: 0,
      cbarCls: s.navHidden ? 'nh-cbar is-hidden' : 'nh-cbar',
      noop: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      megaOpen: !!s.mega, megaExpanded: String(!!s.mega), megaCols: MEGA,
      openMega: () => { if (!s.mega) this.setState({ mega: true }); },
      closeMega: () => { if (s.mega) this.setState({ mega: false }); },
      drawerOpen: !!s.drawer, drawerExpanded: String(!!s.drawer), drawerTop: s.drawer === 'top', drawerAll: s.drawer === 'all',
      drawerLinks: MEGA.map((c) => c.h),

      backDrawer: () => this.setState({ drawer: 'top' })
    };
  }
}
